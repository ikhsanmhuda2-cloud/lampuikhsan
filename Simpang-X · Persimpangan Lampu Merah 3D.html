 if(ln.cars[0]&&ln.cars[0].s>60){ln.g.remove(ln.cars[0].g);ln.cars.shift()}})}
function spawnPed(){const cw=cws[R()*4|0],sg=R()<.5?1:-1,o=(R()-.5)*1.8,a=14+R()*8,b=14+R()*8,c=cw.c+o,
 P=(u)=>cw.t==='NS'?new T.Vector3(u,0,c):new T.Vector3(c,0,u),g=makePed();
 const p={g,cw,wp:[P(-sg*a),P(-sg*5.8),P(sg*5.8),P(sg*b)],i:1,sp:1.3+R()*.35,ph:R()*6,wait:false};g.position.copy(p.wp[0]);g.position.y=.3;scene.add(g);peds.push(p)}
function updPeds(dt){pedT-=dt;if(pedT<=0){if(cfg.ped>0&&peds.length<cfg.ped*3)spawnPed();pedT=(.5+R())*(5/Math.max(cfg.ped,.5))}
 for(let k=peds.length-1;k>=0;k--){const p=peds[k],g=p.g,u=g.userData;let mv=true;
  if(p.wait){if(walkOK(p.cw))p.wait=false;else mv=false}
  if(mv){const tg=p.wp[p.i],dx=tg.x-g.position.x,dz=tg.z-g.position.z,L=Math.hypot(dx,dz),s=p.sp*dt;
   if(L<=s){g.position.x=tg.x;g.position.z=tg.z;p.i++;if(p.i===2&&!walkOK(p.cw))p.wait=true;if(p.i>=p.wp.length){scene.remove(g);peds.splice(k,1);continue}}
   else{g.position.x+=dx/L*s;g.position.z+=dz/L*s;g.rotation.y=Math.atan2(dx,dz)}
   p.ph+=dt*p.sp*5.2}
  const q=p.cw.t==='NS'?g.position.x:g.position.z,sw=mv?Math.sin(p.ph):0;
  u.l[0].rotation.x=sw*.7;u.l[1].rotation.x=-sw*.7;u.a[0].rotation.x=-sw*.6;u.a[1].rotation.x=sw*.6;
  g.position.y=(Math.abs(q)<5.1?0:.3)+Math.abs(sw)*.05}}
function updLamps(){for(let a=0;a<4;a++){const s=sig[a%2?'ew':'ns'],L=lamps[a],bl=Math.floor(plc.blink*2)%2===0;
 lampSet(L.r,s==='R');lampSet(L.y,s==='Y'||(s==='F'&&bl));lampSet(L.g,s==='G')}}
/* ---------- tema ---------- */
let night=true;
function setTheme(n){night=n;document.documentElement.dataset.theme=n?'dark':'light';const bg=n?0x0a0e27:0x8fd3ff;scene.background.setHex(bg);scene.fog.color.setHex(n?0x0a0e27:0xa5defc);
 hemi.color.setHex(n?0x5566b8:0xffffff);hemi.groundColor.setHex(n?0x120f26:0x7a7f8c);hemi.intensity=n?.85:1.15;sun.color.setHex(n?0x8fa8ff:0xfff0d0);sun.intensity=n?.6:1.4;
 winMats.forEach(m=>m.emissiveIntensity=n?1:.04);neon.forEach(m=>m.emissiveIntensity=n?2.6:.35);plights.forEach(l=>l.visible=n);nightObjs.forEach(o=>o.visible=n);
 $('#bNight').classList.toggle('on',n);$('#bDay').classList.toggle('on',!n)}
/* ---------- kamera orbit ---------- */
const cs={az:.8,pol:.95,rad:64},ct={...cs};let orbit=true,pts=new Map(),pd=0;const cv=$('#c');
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);cv.style.cursor='grabbing'});
cv.addEventListener('pointerup',e=>{pts.delete(e.pointerId);pd=0;cv.style.cursor='grab'});cv.addEventListener('pointercancel',e=>pts.delete(e.pointerId));
cv.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const o=pts.get(e.pointerId);
 if(pts.size===1){ct.az-=(e.clientX-o[0])*.005;ct.pol=clamp(ct.pol-(e.clientY-o[1])*.004,.12,1.5);setOrbit(false)}
 pts.set(e.pointerId,[e.clientX,e.clientY]);
 if(pts.size===2){const[a,b]=[...pts.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pd)ct.rad=clamp(ct.rad*pd/d,14,120);pd=d}});
cv.addEventListener('wheel',e=>{e.preventDefault();ct.rad=clamp(ct.rad*(1+e.deltaY*.001),14,120)},{passive:false});
function setOrbit(v){orbit=v;$('#vOrbit').classList.toggle('on',v)}

/* ---------- UI ---------- */
$('#steps').innerHTML=STEPS.map((s,i)=>`<div class="st" data-i="${i}"><i>M0.${i}</i>${s.n}</div>`).join('');
$('#outs').innerHTML=[['Q0.0','U-S MERAH','r'],['Q0.1','U-S KUNING','y'],['Q0.2','U-S HIJAU','g'],['Q0.3','T-B MERAH','r'],['Q0.4','T-B KUNING','y'],['Q0.5','T-B HIJAU','g']].map(([q,n,c])=>`<div class="io"><u class="${c}"></u>${q}<small>${n}</small></div>`).join('');
$('#ins').innerHTML=[['I0.0','AUTO'],['I0.1','MANUAL'],['I0.2','KEDIP']].map(([q,n])=>`<div class="io"><u class="i"></u>${q}<small>${n}</small></div>`).join('');
const stEls=[...document.querySelectorAll('.st')],outEls=[...document.querySelectorAll('#outs .io')],inEls=[...document.querySelectorAll('#ins .io')];
function setMode(m){plc.mode=m;if(m==='flash'){plc.blink=0}else{if(plc.step!==2||true){/* kembali aman lewat semua merah */}}

 document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));document.querySelectorAll('#mans button').forEach(b=>b.disabled=m!=='manual')}

document.querySelectorAll('#mans button').forEach(b=>b.onclick=()=>{plc.target=b.dataset.t;document.querySelectorAll('#mans button').forEach(x=>x.classList.toggle('on',x===b))});
[['g','g',' s'],['y','y',' s'],['r','r',' s'],['d','dens',''],['p','ped','']].forEach(([id,k,u])=>{const s=$('#s_'+id),o=$('#o_'+id);s.oninput=()=>{cfg[k]=+s.value;o.textContent=s.value+u}});

let paused=false;$('#bPause').onclick=e=>{paused=!paused;e.target.classList.toggle('on',paused)};
$('#vDrone').onclick=()=>{setOrbit(false);setView(.8,.95,64)};$('#vStreet').onclick=()=>{setOrbit(false);setView(.25,1.42,30)};$('#vOrbit').onclick=()=>setOrbit(!orbit);
$('#tgl').onclick=()=>document.body.classList.toggle('open');
function remTo(tg){let i=plc.step,r=dur(i)-plc.t;for(let n=0;n<7;n++){i=(i+1)%6;if(i===tg)return r;r+=dur(i)}return r}
function hud(){const f=plc.mode==='flash',m=plc.mode==='manual';
 const cd=(s,g,el)=>{const e=$(el);const st=sig[s];e.className=f?'Y':st==='F'?'Y':st;e.textContent=f?'⚠':m?'--':Math.ceil([g,g+1].includes(plc.step)?dur(plc.step)-plc.t:remTo(g))};
 cd('ns',0,'#nNS');cd('ew',3,'#nEW');
 stEls.forEach((e,i)=>e.classList.toggle('on',!f&&i===plc.step));
 const bl=Math.floor(plc.blink*2)%2===0,on=[sig.ns==='R',sig.ns==='Y'||(f&&bl),sig.ns==='G',sig.ew==='R',sig.ew==='Y'||(f&&bl),sig.ew==='G'];outEls.forEach((e,i)=>e.classList.toggle('on',on[i]));
 inEls.forEach((e,i)=>e.classList.toggle('on',['auto','manual','flash'][i]===plc.mode));
 const pt=f?0:dur(plc.step);$('#tbar').style.width=f?'100%':clamp(plc.t/pt*100,0,100)+'%';$('#ttxt').textContent=f?'T37 TON · DIHENTIKAN (mode kedip)':`T37 TON · ET ${plc.t.toFixed(1)} / PT ${pt.toFixed(1)} s`}

let last=performance.now(),hT=0;setTheme(true);
(function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.05);last=now;
 if(!paused){plcUpdate(dt);updLamps();updCars(dt);updPeds(dt)}
 if(orbit)ct.az+=dt*.06;
 for(const k of['az','pol','rad'])cs[k]+=(ct[k]-cs[k])*Math.min(1,dt*4);

 hT-=dt;if(hT<=0){hud();hT=.1}
